services:
    worker:
        container_name: "hikka-worker"
        build:
            context: .
        volumes:
            - worker:/data
        environment:
            # Use the private Redis container for the database and backups.
            - REDIS_URL=redis://redis:6379/0
        depends_on:
            redis:
                condition: service_healthy
        init: true
        stop_signal: SIGINT
        stop_grace_period: 30s
        restart: unless-stopped
        command: ["python", "-m", "hikka", "--proxy-pass", "--no-tty"]
        ports:
            # Keep the unencrypted setup page local. Remote setup uses the
            # temporary HTTPS lhr.life URL printed in `docker compose logs`.
            - "127.0.0.1:${EXTERNAL_PORT:-8080}:8080"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        pids_limit: 256
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=128m
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    redis:
        container_name: "hikka-redis"
        image: redis:7.4-alpine
        user: redis
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis:/data
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

volumes:
    worker:
    redis:
